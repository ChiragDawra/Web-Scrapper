# Local development stack. Sprint 0 Task 0.2 — backing services only.
# Application containers are added by their own sprints, not here.
#
# PostgreSQL 16: DATABASE_SCHEMA.md defaults every PK to gen_random_uuid(),
# which is core since PG13 — no pgcrypto extension required.
# Redis 7: canonical event bus via Streams + consumer groups (ADR-006), which
# require Redis >= 5.0.

services:
  postgres:
    image: postgres:16-alpine
    container_name: businessscrapper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-businessscrapper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-businessscrapper}
      POSTGRES_DB: ${POSTGRES_DB:-businessscrapper}
      # All timestamps are timestamptz in UTC (ZIP_13 non-negotiable defaults).
      # The 00:00 IST daily-spend reset is application-scheduled, not a DB concern.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Loopback-bound: reachable by host tooling (Alembic, Task 0.3) but not
      # exposed off this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready confirms the server accepts connections, unlike a port probe,
      # which passes during crash recovery while queries are still rejected.
      # -U/-d are required or it probes the wrong default role/database.
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-businessscrapper} -d ${POSTGRES_DB:-businessscrapper}
      interval: 10s
      timeout: 5s
      retries: 5
      # First boot runs initdb against an empty volume, which is far slower than
      # a warm restart; without this, those expected early failures burn retries.
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: businessscrapper-redis
    restart: unless-stopped
    # AOF on: Postgres stays the system of record (ADR-010), but this keeps a
    # container restart from silently dropping in-flight Stream entries.
    # Flags rather than a mounted redis.conf — infra/redis/redis.conf is still an
    # empty Task 0.1 placeholder and populating it is outside this task's scope.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # One connector deployable per marketplace (SERVICE_INTERFACES.md §1), named
  # for the marketplace it reads — Sprint 2 Task 2.6. Flipkart, Myntra and Nykaa
  # get their own services in Sprint 10.
  marketplace-connector-amazon:
    build:
      # Repo root: the service imports libs/, which a context rooted at the
      # service directory could not reach.
      context: .
      dockerfile: services/marketplace-connector/Dockerfile
    container_name: businessscrapper-marketplace-connector-amazon
    restart: unless-stopped
    environment:
      MARKETPLACE_CODE: AMAZON
      # Service name, not 127.0.0.1: the loopback port mapping above is for host
      # tooling, and inside the network this resolves to the container.
      REDIS_URL: redis://redis:6379/0
      MARKETPLACE_POLL_INTERVAL_SECONDS: ${MARKETPLACE_POLL_INTERVAL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        # Not just started: the first poll publishes immediately, and a refused
        # connection at boot would crash the process before the loop begins.
        condition: service_healthy
    # No ports: it publishes to the bus and serves nothing.
    # No postgres dependency: a connector owns no tables.

  # Deal Engine — Sprint 3 Task 3.7. Consumes LISTING_DISCOVERED and
  # USER_INTERESTED, emits DEAL_SCORED (SERVICE_INTERFACES.md §2).
  deal-engine:
    build:
      context: .
      dockerfile: services/deal-engine/Dockerfile
    container_name: businessscrapper-deal-engine
    restart: unless-stopped
    environment:
      # Service names, not 127.0.0.1: the loopback port mappings above are for
      # host tooling, and inside the network these resolve to the containers.
      DATABASE_URL: postgresql://${POSTGRES_USER:-businessscrapper}:${POSTGRES_PASSWORD:-businessscrapper}@postgres:5432/${POSTGRES_DB:-businessscrapper}
      REDIS_URL: redis://redis:6379/0
      # Identifies this worker inside the consumer group; the container ID is
      # stable for the life of the container and unique across replicas.
      CONSUMER_NAME: ${HOSTNAME:-deal-engine}
      # Unset until the API Gateway serves /scoring-config (Sprint 13 Task
      # 13.7). The scorer falls back to its built-in weights and stamps
      # `builtin-v1` into every score_breakdown it writes, so a score computed
      # now stays interpretable after the endpoint exists.
      SCORING_CONFIG_URL: ${SCORING_CONFIG_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        # This service owns six tables and writes on the first event it reads.
        condition: service_healthy
      redis:
        condition: service_healthy
    # No ports: it consumes from the bus and serves nothing.
    # Schema migrations are not run here — `alembic upgrade head` from
    # infra/postgres is an operator step, not a race between app containers.

volumes:
  pgdata:
  redisdata:
