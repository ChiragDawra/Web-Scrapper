# Pre-commit hooks. Sprint 0 Task 0.4.
#
# One config for the whole monorepo (REPOSITORY_STRUCTURE.md line 475). Tool
# settings live in pyproject.toml; this file only wires them into git.
#
# Install once per clone:
#   pre-commit install
# Run over everything:
#   pre-commit run --all-files

# ZIP_01-ZIP_14 are documentation archives. ZIP_13_ENGINEERING_CONTRACTS is
# frozen at v1.0 and ZIP_14 governs process — a whitespace-fixing hook rewriting
# either would silently mutate frozen architecture. Excluded globally so no hook,
# present or future, can touch them.
exclude: ^ZIP_[0-9]+_

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # check-json is deliberately absent. Every .json in the tree is still a
      # 0-byte Task 0.1 placeholder (libs/event_bus/schema/*.json,
      # admin-dashboard/package.json), and an empty file is not valid JSON, so
      # the hook cannot pass on the empty repo. Add it in Sprint 1 Task 1.3,
      # which is what actually writes the event schemas.
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      # IMPLEMENTATION_ROADMAP.md §5: no secrets or credentials committed. This
      # is the mechanical backstop for accounts.credentials_ref holding a
      # reference and never the secret itself (DATABASE_SCHEMA.md §9).
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      # Lint first, then format — the formatter has the last word on layout.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
      - id: mypy
        # pre-commit passes changed files as arguments, which would override the
        # `files` key in pyproject.toml and type-check paths piecemeal. Passing
        # no filenames makes every run cover the same configured tree.
        pass_filenames: false
        args: [--config-file=pyproject.toml]
