# Alembic configuration. Sprint 0 Task 0.3 — migration harness only.
#
# The actual schema (18 tables, ZIP_13_ENGINEERING_CONTRACTS/DATABASE_SCHEMA.md
# §1-§18) is hand-written in revision 0002 by Sprint 1 Task 1.6. This file and
# revision 0001_baseline exist so that migration has a parent to chain onto.
#
# Run from this directory:
#   cd infra/postgres && alembic upgrade head

[alembic]
# Relative to this file's directory, so `alembic` must be invoked from
# infra/postgres. Keeps the tree matching REPOSITORY_STRUCTURE.md §infra
# (alembic.ini beside migrations/, not at the repo root).
script_location = migrations
prepend_sys_path = .

# Revision ids are hand-assigned (0001_baseline, 0002_full_schema, ...) so the
# apply order is readable in `ls versions/`. `alembic revision` follows suit.
file_template = %%(rev)s_%%(slug)s
version_path_separator = os

# Deliberately empty: the URL carries a password and is resolved at runtime by
# migrations/env.py from DATABASE_URL / POSTGRES_* env vars. Never commit a
# connection string here (IMPLEMENTATION_ROADMAP.md §5 — no secrets committed).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
