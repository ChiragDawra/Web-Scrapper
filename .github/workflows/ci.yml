# CI skeleton. Sprint 0 Task 0.5 — lint + test only, no deploy step.
#
# This file lives at .github/workflows/ because GitHub Actions reads workflows
# from nowhere else. REPOSITORY_STRUCTURE.md reserves infra/ci/ for "pipeline
# definitions — provider TBD"; see infra/ci/README.md, which records the provider
# choice and points here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the earlier run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches [tool.ruff] target-version and [tool.mypy] python_version in
  # pyproject.toml. Changing one without the others makes CI disagree with local.
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint, format, type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pre-commit is the single entry point: it owns the pinned versions of
      # ruff and mypy in .pre-commit-config.yaml, so CI cannot drift from what
      # runs on a developer's machine. No Sprint 0 task establishes dependency
      # management yet, so pre-commit itself is pinned inline here.
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.1

      # Building ruff's and mypy's isolated hook environments is the slow part
      # and only changes when the config does.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest==9.1.1

      # tests/ holds only empty Task 0.1 placeholders, and pytest exits 5 —
      # "no tests collected" — rather than 0 when it finds nothing. Treating 5 as
      # success keeps this job honest on the empty repo while still failing on a
      # real test failure. Sprint 1 adds the first tests; delete this branch once
      # the suite is non-empty so an accidentally empty run is caught again.
      - name: Run pytest
        run: |
          set +e
          pytest tests -q
          status=$?
          set -e
          if [ "$status" -eq 5 ]; then
            echo "::notice::No tests collected yet (Sprint 0). Treating as pass."
            exit 0
          fi
          exit "$status"
