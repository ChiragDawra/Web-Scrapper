# CI skeleton. Sprint 0 Task 0.5 — lint + test only, no deploy step.
#
# This file lives at .github/workflows/ because GitHub Actions reads workflows
# from nowhere else. REPOSITORY_STRUCTURE.md reserves infra/ci/ for "pipeline
# definitions — provider TBD"; see infra/ci/README.md, which records the provider
# choice and points here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the earlier run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Matches [tool.ruff] target-version and [tool.mypy] python_version in
  # pyproject.toml. Changing one without the others makes CI disagree with local.
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint, format, type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # pre-commit is the single entry point: it owns the pinned versions of
      # ruff and mypy in .pre-commit-config.yaml, so CI cannot drift from what
      # runs on a developer's machine.
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Building ruff's and mypy's isolated hook environments is the slow part
      # and only changes when the config does.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.PYTHON_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Tests
    runs-on: ubuntu-latest

    # Sprint 2 Task 2.7: the integration tests skip themselves when Redis is
    # unreachable, which kept them honest locally but meant CI proved only the
    # unit suite. A real broker turns those skips into assertions — publishing a
    # LISTING_DISCOVERED and reading it back through a consumer group is the one
    # thing a stand-in cannot check.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Runtime dependencies too, not just pytest — tests import libs/, which
      # imports redis, jsonschema and SQLAlchemy.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      # The Sprint 0 "treat exit 5 as success" branch is gone: that file's own
      # comment said to delete it once the suite was non-empty, and it is — an
      # accidentally empty run is a failure again, which is the point of it.
      - name: Run pytest
        run: pytest tests -q

      # One pytest session per service, not one session over all of them: every
      # service owns a top-level `src` package, so a combined run would see
      # eleven different modules all named `src`. Each service's own
      # pyproject.toml carries the pythonpath that makes this work.
      - name: Run per-service tests
        run: |
          for service in services/*/; do
            if find "$service/tests" \( -name '*_test.py' -o -name 'test_*.py' \) | grep -q .; then
              echo "::group::${service}"
              (cd "$service" && pytest -q)
              echo "::endgroup::"
            fi
          done
